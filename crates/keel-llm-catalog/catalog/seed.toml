# ---------------------------------------------------------------------------
# Antigravity (Google Cloud Code Assist)
#
# Provider is in scope. The protocol module is first-party but lands in phase 3,
# so route building returns a typed `unsupported` error today.
# ---------------------------------------------------------------------------

[[providers]]
id = "antigravity"
name = "Antigravity"
base_url = "https://daily-cloudcode-pa.googleapis.com"
base_url_env = "KEEL_ANTIGRAVITY_BASE_URL"
notes = "Google policy treats third-party use of this backend as unsupported. Opt-in only; surface the account risk before login."

[providers.auth]
type = "google_oauth"
env = ["KEEL_ANTIGRAVITY_ACCESS_TOKEN"]

[[providers.models]]
