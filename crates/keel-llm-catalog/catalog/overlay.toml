# ---------------------------------------------------------------------------
# Antigravity (Google Cloud Code Assist)
#
# Provider is in scope. The protocol module is first-party but lands in phase 3,
# so route building returns a typed `unsupported` error today. Not on
# models.dev; every fact is pinned.
# ---------------------------------------------------------------------------

[[providers]]
id = "antigravity"
name = "Antigravity"
base_url = "https://daily-cloudcode-pa.googleapis.com"
base_url_env = "KEEL_ANTIGRAVITY_BASE_URL"
