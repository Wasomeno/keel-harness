# ---------------------------------------------------------------------------
# NeuralWatt
# ---------------------------------------------------------------------------

# NeuralWatt serves the OpenAI-compatible endpoints at /v1/chat/completions,
# plus /v1/messages and /v1/responses from the same base URL. Models are
# registered on Chat until a live capture verifies the other protocols; the
# models list also reports per-model capabilities, which the snapshot carries.
[[providers]]
id = "neuralwatt"
name = "NeuralWatt"
base_url = "https://api.neuralwatt.com/v1"
base_url_env = "KEEL_NEURALWATT_BASE_URL"
models_dev_id = "neuralwatt"

[providers.auth]
type = "bearer"
env = ["NEURALWATT_API_KEY"]

[[providers.models]]
id = "nw-small"
name = "NeuralWatt Small"
protocol = "openai-chat"

[[providers.models]]
