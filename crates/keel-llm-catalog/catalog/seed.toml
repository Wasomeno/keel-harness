# Seed catalog.
#
# This file is provisional. Model ids, context windows and protocol assignments
# are hand-written so the first slice can run; the real catalog will be
# generated from models.dev at build time (open topic O-006).
#
# Endpoints were taken from the provider research notes. Protocol is a property
# of the model, not the provider: OpenCode and CommandCode each serve several
# protocols from one base URL.

version = 1
notes = "Seed catalog; provisional until O-006."

# ---------------------------------------------------------------------------
# OpenAI
# ---------------------------------------------------------------------------

[[providers]]
id = "openai"
name = "OpenAI"
base_url = "https://api.openai.com/v1"
base_url_env = "KEEL_OPENAI_BASE_URL"

[providers.auth]
type = "bearer"
env = ["OPENAI_API_KEY"]

[[providers.models]]
id = "gpt-4.1"
name = "GPT-4.1"
protocol = "openai-chat"
context_window = 1047576
max_output_tokens = 32768

[providers.models.capabilities]
tools = true
images = true

[[providers.models]]
id = "gpt-4.1-mini"
name = "GPT-4.1 mini"
protocol = "openai-chat"
context_window = 1047576
max_output_tokens = 32768

[providers.models.capabilities]
tools = true
images = true

[[providers.models]]
id = "gpt-4o"
name = "GPT-4o"
protocol = "openai-chat"
context_window = 128000
max_output_tokens = 16384

[providers.models.capabilities]
tools = true
images = true

[[providers.models]]
