# Eval cassette manifest.
#
# One cassette per task, holding every model exchange of that recorded run in
# order. `every_eval_cassette_is_covered_by_the_manifest` fails when a cassette
# under `evals/` is unlisted, when a listed cassette is missing, when the
# cassette name does not match the task id, or when a stored request carries an
# unredacted credential. The scenario's `covers` line says what behavior the
# cassette exercises.

[[scenario]]
task = "truncate"
file = "evals/truncate.json"
protocol = "openai-chat"
provider = "neuralwatt"
model = "deepseek-v4.1-flash"
covers = "fix an off-by-one truncation bug, then verify with the task check"

