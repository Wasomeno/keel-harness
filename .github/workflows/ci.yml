name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep for the search tool
        shell: bash
        run: |
          if command -v rg >/dev/null; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Windows)
              choco install ripgrep -y
              ;;
            macOS)
              brew install ripgrep
              ;;
            *)
              sudo apt-get update && sudo apt-get install -y ripgrep
              ;;
          esac
      - name: Verify ripgrep is on PATH
        run: rg --version
      - name: Allow unprivileged user namespaces for the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark trace tests
        run: python3 -m unittest discover -s benchmarks/tests -v
      - name: Compile benchmark Python sources
        run: python3 -m compileall benchmarks
