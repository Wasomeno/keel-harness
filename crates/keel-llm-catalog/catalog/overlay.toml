# ---------------------------------------------------------------------------
# Custom OpenAI-compatible endpoint
#
# Not on models.dev; every fact is pinned. Zero limits mean unknown, which
# disables compaction for this route.
# ---------------------------------------------------------------------------

[[providers]]
id = "custom"
name = "Custom endpoint"
base_url = ""
base_url_env = "KEEL_CUSTOM_BASE_URL"
notes = "Set KEEL_CUSTOM_BASE_URL. Keys are optional for local servers."

[providers.auth]
type = "optional_bearer"
env = ["KEEL_CUSTOM_API_KEY"]

[[providers.models]]
id = "default"
name = "OpenAI-compatible model"
protocol = "openai-chat"
context_window = 0
max_output_tokens = 0

[providers.models.capabilities]
tools = true
images = false
reasoning = false
cache = false
