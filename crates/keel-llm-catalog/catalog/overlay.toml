# keel catalog overlay.
#
# Model facts (names, context windows, output limits and capabilities) come
# from `models.dev.toml`, a committed snapshot generated from
# https://models.dev. This file carries what models.dev does not know:
# provider endpoints, auth, the protocol each model speaks, and pins for any
# fact that must not move when the snapshot is refreshed.
#
# Precedence, highest first:
#   1. a runtime overlay (`KEEL_CATALOG` or the platform config directory)
#   2. this file
#   3. the generated models.dev snapshot
#   4. struct defaults
#
# A value set here wins over the snapshot. Omit a generated field to take the
# snapshot value. Every model names its protocol because models.dev does not
# carry one. A model that is not in models.dev must pin all of its facts here.
# The snapshot is keyed by models.dev ids; set `models_dev_id` when a keel id
# differs from the models.dev id (for example `grok` reads from `xai`).
#
# Regenerate the snapshot with:
#   cargo run -p keel-catalog-gen

version = 1
notes = "models.dev snapshot plus the keel overlay; refresh with `cargo run -p keel-catalog-gen`."

# ---------------------------------------------------------------------------
# OpenAI
# ---------------------------------------------------------------------------

[[providers]]
id = "openai"
name = "OpenAI"
base_url = "https://api.openai.com/v1"
base_url_env = "KEEL_OPENAI_BASE_URL"
models_dev_id = "openai"

[providers.auth]
type = "bearer"
env = ["OPENAI_API_KEY"]

[[providers.models]]
id = "gpt-4.1"
name = "GPT-4.1"
protocol = "openai-chat"

[[providers.models]]
id = "gpt-4.1-mini"
name = "GPT-4.1 mini"
protocol = "openai-chat"

[[providers.models]]
id = "gpt-4o"
name = "GPT-4o"
protocol = "openai-chat"

[[providers.models]]
id = "gpt-5.5"
name = "GPT-5.5"
protocol = "openai-responses"
# Pinned: models.dev reports 1050000. The window feeds compaction and
# `keel route`; changing it is a behavior change, not a snapshot refresh.
context_window = 400000

[providers.models.capabilities]
cache = true

