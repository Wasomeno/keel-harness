name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin: keel
            musl: false
          - artifact_name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            bin: keel
            musl: true
          - artifact_name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            bin: keel
            musl: true
          - artifact_name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin: keel.exe
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --locked -p keel-cli --target "${{ matrix.target }}"
      - name: Package release archive
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BIN_NAME: ${{ matrix.bin }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="dev-${GITHUB_SHA::7}"
          fi
          PREFIX="keel-${TAG}-${ARTIFACT_NAME}"
          STAGE="dist/${PREFIX}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/${BIN_NAME}" "$STAGE/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE/"
          if [ "$ARCHIVE_EXT" = "zip" ]; then
            ARCHIVE="${PREFIX}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${PREFIX}/*' -DestinationPath 'dist/${ARCHIVE}'"
          else
            ARCHIVE="${PREFIX}.tar.gz"
            tar -C dist -czf "dist/${ARCHIVE}" "${PREFIX}"
          fi
          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: pkg
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: ${{ steps.pkg.outputs.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum keel-*.tar.gz keel-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/keel-*.tar.gz
            artifacts/keel-*.zip
            artifacts/SHA256SUMS.txt
