[package]
name = "keel-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tool registry, sandbox and built-in tools for keel"

[dependencies]
keel-llm-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ignore.workspace = true
globset.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

# Landlock syscalls. The sandbox module is the only unsafe in this crate:
# `pre_exec` is an unsafe std API, and it runs only in the forked child.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

# The umask test needs `process`; keeping it out of the normal dependency
# leaves the shipped feature surface unchanged.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

# This crate does not inherit the workspace `unsafe_code = "forbid"` lint.
# `Command::pre_exec` is unsafe, and Landlock has to be installed in the child
# after fork. Unsafe is denied everywhere except `src/sandbox.rs`, which allows
# it on Linux. Clippy matches the workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
